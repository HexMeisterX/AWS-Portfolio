<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <!-- Outer circle (plate outline) -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="none" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.5" />
  
  <!-- Anchor + Dining Motif -->
  <!-- Anchor Ring -->
  <circle cx="50" cy="24" r="5" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <!-- Anchor Shank (Stem) -->
  <line x1="50" y1="29" x2="50" y2="68" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Crossbar (Stock) -->
  <line x1="38" y1="36" x2="62" y2="36" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Anchor Flukes (Crescent curve) -->
  <path d="M 26 56 C 30 72, 70 72, 74 56" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Left Fluke Tip (Arrow) -->
  <path d="M 26 56 L 22 52 L 28 50 Z" fill="url(#goldGrad)" />
  <!-- Right Fluke Tip (Arrow) -->
  <path d="M 74 56 L 78 52 L 72 50 Z" fill="url(#goldGrad)" />

  <!-- Wave Lines at base -->
  <path d="M 32 78 Q 41 74, 50 78 T 68 78" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 37 83 Q 43 80, 50 83 T 63 83" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />
</svg>
